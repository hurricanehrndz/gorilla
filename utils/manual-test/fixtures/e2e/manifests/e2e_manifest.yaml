# Chrome end-to-end manifest. Pulls the self-serve smoke fixtures in through
# included_manifests so run-selfserve-smoke.ps1 still passes against this
# manifest, and offers a real MSI (Google Chrome) as an optional install.
name: e2e_manifest
included_manifests:
  - selfserve_manifest
catalogs:
  - e2e_catalog
  - selfserve_catalog
optional_installs:
  - GoogleChrome
