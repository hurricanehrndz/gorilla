name: Build Release
# Trigger on every main branch push
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get branch & rev
        run: |
          echo "Working Path: ${Env:GITHUB_WORKSPACE}"
          $branchName = $Env:GITHUB_REF -replace 'refs/heads/', ''
          echo "Branch: ${branchName}"
          echo "CURRENT_BRANCH=${branchName}" >> $Env:GITHUB_ENV
          $revision = (git rev-parse HEAD)
          echo "REVISION=${revision}" >> $Env:GITHUB_ENV
      - name: Get go version
        run: |
          $vers=((go version) -replace "go version go", "" -replace " windows/amd64" )
          echo "GO_VERSION=${vers}" >> $Env:GITHUB_ENV
      - name: Create version tag
        id: create_tag
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "/[\\s]*/"
          version_format: "${major}.${minor}"
          namespace: ''
          bump_each_commit: false
      - name: Install frontend dependencies
        working-directory: gorilla-ui/frontend
        run: npm ci
      - name: Build frontend production assets
        working-directory: gorilla-ui/frontend
        run: npm run build
      - name: Build gorilla.exe
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $pkg = "github.com/1dustindavis/gorilla/pkg/version"
          $ldflags = @(
            "-X $pkg.appName=gorilla"
            "-X $pkg.version=${{ steps.create_tag.outputs.version_tag }}"
            "-X $pkg.branch=${{ env.CURRENT_BRANCH }}"
            "-X $pkg.buildDate=$(Get-Date -format s)"
            "-X $pkg.revision=${{ env.REVISION }}"
            "-X $pkg.goVersion=${{ env.GO_VERSION }}"
          ) -join ' '
          go build -v -o build/gorilla.exe -ldflags="$ldflags" ./cmd/gorilla
      - name: Build gorilla-ui.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -tags production -ldflags "-H windowsgui" -o build/gorilla-ui.exe ./gorilla-ui
      - name: Build makecatalogs (linux/darwin/windows, amd64/arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          $ldflags = "-X github.com/1dustindavis/gorilla/pkg/version.version=${{ steps.create_tag.outputs.version_tag }}"
          foreach ($os in "linux", "darwin", "windows") {
            foreach ($arch in "amd64", "arm64") {
              $ext = if ($os -eq "windows") { ".exe" } else { "" }
              $env:GOOS = $os
              $env:GOARCH = $arch
              go build -ldflags="$ldflags" -o "build/makecatalogs-$os-$arch$ext" ./cmd/makecatalogs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Upload executables workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gorilla-exe-release
          path: |
            ./build/gorilla.exe
            ./build/gorilla-ui.exe
            ./build/makecatalogs-*
          if-no-files-found: error
      - name: Cut release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: false
          prerelease: true
          artifacts: "./build/gorilla.exe,./build/gorilla-ui.exe,./build/makecatalogs-*"
          tag: ${{ steps.create_tag.outputs.version_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
